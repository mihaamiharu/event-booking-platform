name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:req-ids
      - run: npm run test:traceability
      - run: npm run lint:redaction
      - run: npm run test:unit
      - run: npm run test:db
      - run: npm run build --workspace=client
      - run: npm run setup:local
      - run: npm run test:api
      - name: Remove unrelated Google Chrome APT source
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
      - if: runner.os == 'Linux'
        run: npm run install:browsers:with-deps --workspace=tests
      - if: runner.os != 'Linux'
        run: npm run install:browsers --workspace=tests
      - run: npm run test:e2e
      - name: Upload browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}-${{ github.run_id }}
          path: |
            tests/test-results/
            tests/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
